{% extends "cotacoes/base.html" %}

{% block title %}Login | Frank Costa{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-4">
            <div class="card-app">
                <h4 class="fw-bold mb-3 text-center">Acesso ao CRM</h4>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Usuário</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Senha</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    {% if form.errors %}
                        <p class="text-danger small mb-3">Usuário ou senha inválidos.</p>
                    {% endif %}
                    <button type="submit" class="btn btn-primary-custom w-100 fw-bold">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
